<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Admin — NewNational{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="/static/css/main.css" rel="stylesheet"/>
  <style>
    body { background: #f5f6f8; }

    /* ── DESKTOP SIDEBAR ── */
    .admin-sidebar {
      width: 220px; height: 100vh;
      background: #111; position: fixed;
      top: 0; left: 0; z-index: 200;
      display: flex; flex-direction: column;
      transition: transform 0.3s;
    }
    .admin-sidebar .brand {
      padding: 18px 20px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; justify-content: space-between;
    }
    .admin-sidebar .nav-link {
      color: rgba(255,255,255,0.55) !important;
      padding: 11px 20px !important; font-size: 0.9rem;
      border-left: 3px solid transparent;
      display: flex; align-items: center; gap: 10px;
      transition: all 0.2s;
    }
    .admin-sidebar .nav-link:hover,
    .admin-sidebar .nav-link.active {
      color: #fff !important;
      background: rgba(255,255,255,0.06);
      border-left-color: #2ecc71;
    }
    .admin-sidebar .nav-link::after { display: none !important; }
    .admin-sidebar .nav-link i { font-size: 1.1rem; width: 20px; }

    .admin-main { margin-left: 220px; min-height: 100vh; }

    /* ── MOBILE TOP BAR ── */
    .admin-topbar {
      display: none;
      background: #111; padding: 12px 16px;
      align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 150;
    }
    .admin-topbar .brand-text { color: white; font-weight: 900; font-size: 1rem; }

    /* ── MOBILE BOTTOM NAV ── */
    .admin-bottom-nav {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #111; z-index: 200;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .admin-bottom-nav a {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 8px 4px; color: rgba(255,255,255,0.5);
      text-decoration: none; font-size: 0.62rem; font-weight: 600;
      letter-spacing: 0.3px; transition: color 0.2s;
      gap: 3px;
    }
    .admin-bottom-nav a i { font-size: 1.3rem; }
    .admin-bottom-nav a.active, .admin-bottom-nav a:hover { color: #2ecc71; }

    /* ── MOBILE DRAWER ── */
    .admin-drawer-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 190;
    }
    .admin-drawer-overlay.open { display: block; }

    /* ── RESPONSIVE ── */
    @media(max-width: 991px) {
      .admin-sidebar { transform: translateX(-100%); }
      .admin-sidebar.open { transform: translateX(0); }
      .admin-main { margin-left: 0; padding-bottom: 70px; }
      .admin-topbar { display: flex; }
      .admin-bottom-nav { display: flex; }
    }

    /* ── CONTENT PADDING ── */
    .admin-page { padding: 24px; }
    @media(max-width: 576px) { .admin-page { padding: 16px; } }

    /* ── STAT CARDS MOBILE ── */
    .stat-card { background: white; border-radius: 14px; padding: 18px; border: 1.5px solid #e4e6ea; }
    .stat-num { font-size: 1.8rem; font-weight: 900; color: #111; line-height: 1.1; }

    /* ── TABLE SCROLL ── */
    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

    /* ── ORDER CARDS (mobile-friendly alternative to table) ── */
    .order-card {
      background: white; border-radius: 12px;
      border: 1.5px solid #e4e6ea; padding: 14px 16px;
      margin-bottom: 10px;
    }
    .order-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>

<!-- MOBILE TOP BAR -->
<div class="admin-topbar">
  <div class="d-flex align-items-center gap-3">
    <button class="btn btn-sm p-0 border-0 bg-transparent text-white" onclick="openDrawer()">
      <i class="bi bi-list" style="font-size:1.5rem"></i>
    </button>
    <span class="brand-text"><span style="color:#2ecc71">NN</span> Admin</span>
  </div>
  <a href="/" target="_blank" class="text-white small"><i class="bi bi-shop me-1"></i>Store</a>
</div>

<!-- SIDEBAR OVERLAY -->
<div class="admin-drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>

<!-- SIDEBAR -->
<div class="admin-sidebar" id="adminSidebar">
  <div class="brand">
    <span style="color:white;font-weight:900;font-size:1.05rem"><span style="color:#2ecc71">NN</span> Admin</span>
    <button class="btn btn-sm p-0 border-0 bg-transparent text-white d-lg-none" onclick="closeDrawer()">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>
  <nav class="nav flex-column flex-grow-1 pt-2">
    <a class="nav-link {% block nav_dashboard %}{% endblock %}" href="/admin" onclick="closeDrawer()">
      <i class="bi bi-speedometer2"></i> Dashboard
    </a>
    <a class="nav-link {% block nav_products %}{% endblock %}" href="/admin/products" onclick="closeDrawer()">
      <i class="bi bi-box"></i> Products
    </a>
    <a class="nav-link {% block nav_orders %}{% endblock %}" href="/admin/orders" onclick="closeDrawer()">
      <i class="bi bi-bag-check"></i> Orders
    </a>
  </nav>
  <div class="nav flex-column pb-3 border-top border-secondary mt-2 pt-2">
    <a class="nav-link" href="/" target="_blank"><i class="bi bi-shop"></i> View Store</a>
    <a class="nav-link text-danger" href="/logout"><i class="bi bi-box-arrow-right"></i> Logout</a>
  </div>
</div>

<!-- MAIN CONTENT -->
<div class="admin-main">
  {% block content %}{% endblock %}
</div>

<!-- MOBILE BOTTOM NAV -->
<nav class="admin-bottom-nav">
  <a href="/admin" class="{% block mob_dashboard %}{% endblock %}">
    <i class="bi bi-speedometer2"></i>Dashboard
  </a>
  <a href="/admin/products" class="{% block mob_products %}{% endblock %}">
    <i class="bi bi-box"></i>Products
  </a>
  <a href="/admin/orders" class="{% block mob_orders %}{% endblock %}">
    <i class="bi bi-bag-check"></i>Orders
  </a>
  <a href="/" target="_blank">
    <i class="bi bi-shop"></i>Store
  </a>
  <a href="/logout" style="color:rgba(255,100,100,0.7)">
    <i class="bi bi-box-arrow-right"></i>Logout
  </a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function openDrawer() {
  document.getElementById('adminSidebar').classList.add('open');
  document.getElementById('drawerOverlay').classList.add('open');
}
function closeDrawer() {
  document.getElementById('adminSidebar').classList.remove('open');
  document.getElementById('drawerOverlay').classList.remove('open');
}
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
